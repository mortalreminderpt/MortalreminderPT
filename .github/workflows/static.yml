name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://ptzhao.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Translate and persist changed content
        id: translations
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/ci-translations.mjs
      - run: npm run build
        env:
          SOURCE_REVISION: ${{ steps.translations.outputs.revision }}
      - run: npm run typecheck
      - run: npm run test:content
      - run: npm run test:i18n
      - run: npm run test:authoring
      - name: Verify no translation credential reaches the public artifact
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run test:secrets
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/gh-pages'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/gh-pages'
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/gh-pages'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
